[package]
name = "rocketchat-message-parser"
version = "0.1.0"
edition = "2021"
description = "Linear-time Rust implementation of the @rocket.chat/message-parser grammar"
license = "MIT"
publish = false

[lib]
name = "message_parser"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustc-hash = "2"

[features]
work-report = []

[dev-dependencies]
proptest = "1.12.0"

[[test]]
name = "linear_work"
required-features = ["work-report"]

[[example]]
name = "benchmark"
required-features = ["work-report"]
